# Install at /etc/nginx/sites-available/sprinkles
#
# Path in the static location block assumes the project lives at
# /home/pi/sprinkles -- adjust if yours differs.

server {
    listen 80;
    server_name _;

    # Serve static assets (CSS, htmx.min.js) directly -- skips Python
    # entirely for these, rather than proxying every CSS/JS request
    # through uvicorn for no reason.
    location /static/ {
        alias /home/pi/sprinkles/app/static/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
